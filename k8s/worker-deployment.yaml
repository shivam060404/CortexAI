apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexai-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortexai-worker
  template:
    metadata:
      labels:
        app: cortexai-worker
    spec:
      containers:
        - name: worker
          image: cortexai/backend:phase2
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "backend.workers.runner"]
          startupProbe:
            exec:
              command: ["sh", "-c", "test -f /app/data/worker.ready"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /app/data/worker.ready"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  "test -f /app/data/worker.heartbeat && python3 - <<'PY'\nfrom pathlib import Path\nimport time\nheartbeat = Path('/app/data/worker.heartbeat')\nvalue = float(heartbeat.read_text().strip())\nraise SystemExit(0 if (time.time() - value) < 60 else 1)\nPY",
                ]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: WORKER_READINESS_FILE
              value: /app/data/worker.ready
            - name: WORKER_HEARTBEAT_FILE
              value: /app/data/worker.heartbeat
            - name: WORKER_MIN_REPLICAS
              value: "2"
            - name: WORKER_MAX_REPLICAS
              value: "12"
            - name: WORKER_TARGET_CPU_UTILIZATION_PCT
              value: "70"
            - name: WORKER_TARGET_QUEUE_DEPTH_PER_POD
              value: "10"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortexai-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortexai-worker
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: queue_depth_per_pod
        target:
          type: AverageValue
          averageValue: "10"
