apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortexai-api
  template:
    metadata:
      labels:
        app: cortexai-api
    spec:
      containers:
        - name: api
          image: cortexai/backend:phase2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: WORKER_READINESS_FILE
              value: /app/data/worker.ready
            - name: WORKER_HEARTBEAT_FILE
              value: /app/data/worker.heartbeat
---
apiVersion: v1
kind: Service
metadata:
  name: cortexai-api
spec:
  selector:
    app: cortexai-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
