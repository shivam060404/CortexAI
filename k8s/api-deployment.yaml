# =============================================================================
# CortexAI API — Production Kubernetes Manifests
# =============================================================================
# Includes: Namespace, ConfigMap, Secret, Deployment, Service, HPA, Ingress,
#           PodDisruptionBudget, NetworkPolicy
# =============================================================================

# --- Namespace ---
apiVersion: v1
kind: Namespace
metadata:
  name: cortexai
  labels:
    app.kubernetes.io/name: cortexai
---
# --- ConfigMap (non-sensitive configuration) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortexai-config
  namespace: cortexai
data:
  DATABASE_URL: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/cortexai"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
  MCP_ENABLED: "True"
  RATE_LIMIT_ENABLED: "True"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  MAX_ITERATIONS: "20"
  MAX_TOKENS_PER_SESSION: "50000"
  AGENT_TIMEOUT_SECONDS: "120"
  SUBAGENT_MAX_TOKENS: "10000"
  SUBAGENT_MAX_STEPS: "10"
  SUBAGENT_TIMEOUT: "60"
  GRAPH_CACHE_MAX_SIZE: "50"
  GRAPH_BACKEND: "memory"
  SUPERVISOR_LOOP_THRESHOLD: "3"
  CONTENT_POLICY_MODE: "auto"
  AUDIT_RETENTION_DAYS: "365"
  WS_HEARTBEAT_INTERVAL: "30"
  WS_HEARTBEAT_TIMEOUT: "90"
  MAX_REQUEST_BODY_SIZE: "10485760"
  HITL_TIMEOUT_SECONDS: "300"
  HITL_MAX_TIMEOUT_SECONDS: "600"
  SECRETS_BACKEND: "env"
  ML_CLASSIFIER_MODE: "heuristic"
  WORKER_READINESS_FILE: "/app/data/worker.ready"
  WORKER_HEARTBEAT_FILE: "/app/data/worker.heartbeat"
---
# --- Secret (sensitive API keys — reference from Vault or external secret operator in prod) ---
apiVersion: v1
kind: Secret
metadata:
  name: cortexai-secrets
  namespace: cortexai
type: Opaque
stringData:
  MISTRAL_API_KEY: "${MISTRAL_API_KEY}"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  TAVILY_API_KEY: "${TAVILY_API_KEY}"
  EXA_API_KEY: "${EXA_API_KEY}"
  FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexai-api
  namespace: cortexai
  labels:
    app: cortexai-api
    app.kubernetes.io/name: cortexai
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cortexai-api
  template:
    metadata:
      labels:
        app: cortexai-api
        app.kubernetes.io/name: cortexai
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cortexai-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: cortexai/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # --- Resource Limits ---
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # --- Probes ---
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # --- Environment ---
          envFrom:
            - configMapRef:
                name: cortexai-config
            - secretRef:
                name: cortexai-secrets
          # --- Security Context ---
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: cortexai-api
  namespace: cortexai
spec:
  selector:
    app: cortexai-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# --- HorizontalPodAutoscaler ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortexai-api
  namespace: cortexai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortexai-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# --- Ingress ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortexai-api
  namespace: cortexai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/websocket-services: "cortexai-api"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.cortexai.local
      secretName: cortexai-tls
  rules:
    - host: api.cortexai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortexai-api
                port:
                  number: 80
---
# --- PodDisruptionBudget ---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cortexai-api-pdb
  namespace: cortexai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cortexai-api
---
# --- NetworkPolicy (restrict ingress to API pods) ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cortexai-api-netpol
  namespace: cortexai
spec:
  podSelector:
    matchLabels:
      app: cortexai-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: cortexai-frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: cortexai-worker
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to: []  # Allow DNS
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []  # Allow HTTPS egress (API calls to LLM providers)
      ports:
        - protocol: TCP
          port: 443
